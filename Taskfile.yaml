version: "3"

vars:
  VERSION:
    sh: printf 'dev+%s' "$(git rev-parse --short HEAD 2>/dev/null || echo unknown)"
  LDFLAGS: -X main.version={{.VERSION}}
  LINT_BASELINE: e3fed9c91918d9c36766dd47d878c1b5466238d1
  CLI_FAMILIES: '^Test(Auth|OpenAIAuth|DeviceLogin|ProviderChoice|CLIChooser|TerminalKeyPrompt|Daemon|Desktop|Run|Native|Web|Headless|Sessions|TruncAndAgo|PushOTLP|MainDispatchesHeadlessCommands|ClientEntryPaths|DistributionMalformed|MCP|Acp|ACP|Update|DistributionUpdate)'

tasks:
  default:
    cmds: [task --list]
    silent: true

  run:
    desc: "Run whipcode locally from source (pass flags via CLI_ARGS: task run -- -m glm-5.2-fast)"
    interactive: true
    deps: [web-assets]
    cmds:
      - go run -ldflags "{{.LDFLAGS}}" ./cmd/whip {{.CLI_ARGS}}

  build:
    desc: Build whipcode with the web app into ./whipcode (run npm ci first)
    deps: [web-assets]
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o whipcode ./cmd/whip

  update:local:
    desc: Build, sign and install local macOS Desktop + whipcode, then restart the shared daemon
    cmds:
      - node scripts/update-local.mjs {{.CLI_ARGS}}

  test:update-local:
    desc: Test local installation staging and failure recovery with disposable files
    cmds:
      - node --test scripts/update-local.test.mjs

  onboarding:docker:
    desc: Build working files and open a disposable TUI + web app at localhost:4000
    interactive: true
    cmds:
      - node scripts/onboarding-docker.mjs {{.CLI_ARGS}}

  test:onboarding-docker:
    desc: Test Docker onboarding orchestration and local renderer provenance
    cmds:
      - node --test scripts/onboarding-docker.test.mjs scripts/renderer-artifact.test.mjs

  install:
    desc: Install whipcode with the web app to GOBIN or GOPATH/bin
    deps: [build]
    cmds:
      - |
        dest=$(go env GOBIN)
        if [ -z "$dest" ]; then dest="$(go env GOPATH)/bin"; fi
        mkdir -p "$dest"
        install -m 755 whipcode "$dest/whipcode"

  web-assets:
    desc: Build and package the production web app for go:embed
    cmds:
      - npm run build:web
      - node scripts/pack-web.mjs

  web:
    desc: Check web types, production assets, component tests and theme generation drift
    cmds:
      - go run ./cmd/themegen -check
      - npm run check:web
      - npm run test:web
      - npm run check -w @whip/ui
      - npm run test -w @whip/ui
      - node --test scripts/pack-web.test.mjs
      - node --test apps/web/scripts/stylex-dev.test.mjs
      - node --test apps/web/scripts/dev-proxy.test.mjs

  benchmark:
    desc: "Benchmark startup: binary boot (--version) and read-only native declarations/selection (-bench); no credentials or network"
    deps: [build]
    cmds:
      - |
        if command -v hyperfine >/dev/null 2>&1; then
          hyperfine -N --warmup 5 './whipcode --version' './whipcode -bench'
        else
          for cmd in "./whipcode --version" "./whipcode -bench"; do
            start=$(date +%s%N)
            for i in $(seq 1 50); do $cmd >/dev/null; done
            end=$(date +%s%N)
            echo "$cmd: $(( (end - start) / 50 / 1000000 )).$(( (end - start) / 50 / 100000 % 10 )) ms avg (50 runs)"
          done
        fi

  test:
    desc: Run all tests
    cmds:
      - go test ./...

  check:fast:
    desc: Complete-module formatting and fast regressions; heavy clients run in their bounded race groups
    vars:
      FAST_PACKAGES:
        sh: |
          packages=$(go list ./...) || exit
          for package in $packages; do
            case "$package" in
              */internal/runtime|*/internal/engine/process|*/internal/tui|*/cmd/whip) ;;
              *) printf '%s ' "$package" ;;
            esac
          done
    cmds:
      - |
        unformatted=$(gofmt -s -l .)
        if [ -n "$unformatted" ]; then
          echo "$unformatted"
          exit 1
        fi
      - go test -timeout=2m {{.FAST_PACKAGES}}
      - go test -timeout=5m ./internal/runtime
      - go build ./internal/engine/process

  check:build:
    desc: Whole-module formatting, fast regressions, test compilation, vet and TUI deadlock analysis
    cmds:
      - task: models:check
      - task: check:fast
      # Compile test-only eval packages too; they intentionally export no library.
      - go test -run '^$' ./...
      - go vet ./...
      - go run ./cmd/whipvet ./...

  check:race:
    desc: Complete Go race/shuffle suite in complementary bounded groups
    cmds:
      - task: check:race-store
      - task: check:race-runtime
      - task: check:race-other
      - task: check:native-cli

  check:race-store:
    desc: Complete SQL store race suite in complementary bounded groups
    cmds:
      - task: check:race-store-first
      - task: check:race-store-rest

  check:race-store-first:
    desc: SQL store race tests whose names begin TestA through TestM
    cmds:
      - mkdir -p test-results/go
      - go test -coverprofile=test-results/go/race-store-first.out -p=2 -race -shuffle=on -count=1 -timeout=10m -run '^Test[A-M]' ./internal/store

  check:race-store-rest:
    desc: Every other SQL store test and example under the race detector
    cmds:
      - mkdir -p test-results/go
      # Complement the first group, including newly added test names/examples.
      - go test -coverprofile=test-results/go/race-store-rest.out -p=2 -race -shuffle=on -count=1 -timeout=10m -skip '^Test[A-M]' ./internal/store

  check:race-runtime:
    desc: Complete runtime race suite in complementary bounded groups
    cmds:
      - task: check:race-runtime-first
      - task: check:race-runtime-middle
      - task: check:race-runtime-rest

  check:race-runtime-first:
    desc: Runtime race tests whose names begin TestA through TestC
    cmds:
      - mkdir -p test-results/go
      - go test -coverprofile=test-results/go/race-runtime-first.out -p=2 -race -shuffle=on -count=1 -timeout=10m -run '^Test[A-C]' ./internal/runtime

  check:race-runtime-middle:
    desc: Runtime race tests whose names begin TestD through TestM
    cmds:
      - mkdir -p test-results/go
      - go test -coverprofile=test-results/go/race-runtime-middle.out -p=2 -race -shuffle=on -count=1 -timeout=10m -run '^Test[D-M]' ./internal/runtime

  check:race-runtime-rest:
    desc: Every other runtime test and example under the race detector
    cmds:
      - mkdir -p test-results/go
      # Complement both A–M groups, including new names, examples and fuzz seeds.
      - go test -coverprofile=test-results/go/race-runtime-rest.out -p=2 -race -shuffle=on -count=1 -timeout=10m -skip '^Test[A-M]' ./internal/runtime

  check:race-other:
    desc: Every Go package outside the separately partitioned store, runtime and terminal/CLI clients
    vars:
      OTHER_PACKAGES:
        sh: |
          packages=$(go list ./...) || exit
          for package in $packages; do
            case "$package" in
              */internal/store|*/internal/runtime|*/internal/tui|*/cmd/whip) ;;
              *) printf '%s ' "$package" ;;
            esac
          done
    cmds:
      - mkdir -p test-results/go
      - go test -coverprofile=test-results/go/race-other.out -p=2 -race -shuffle=on -count=1 -timeout=10m {{.OTHER_PACKAGES}}

  check:clients:
    desc: Native contracts, SDK/examples, complete Go clients and real-process acceptance
    cmds:
      - task: contract
      - task: sdk
      - node --test internal/browser/extrelay/worker.test.mjs
      - task: check:native-cli
      - task: check:fixture
      - task: check:invariants

  check:product-web:
    desc: Shared app, web assets, UI and browser support regressions
    cmds:
      - task: web
      - npm run build:storybook -w @whip/ui

  check:product-browser:
    desc: Native production web acceptance in Chromium and Firefox
    cmds:
      - task: web-assets
      - node --test --test-concurrency=1 apps/web/scripts/native-fixture.test.mjs apps/web/scripts/native-stream-fixture.test.mjs apps/web/scripts/native-performance-fixture.test.mjs
      - node apps/web/scripts/browser.mjs
      - node apps/web/scripts/snapshot-refresh.mjs
      - node apps/web/scripts/session-search.mjs
      - node apps/web/scripts/session-tabs.mjs
      - node apps/web/scripts/new-chat-tabs.mjs
      - node apps/web/scripts/session-title-notifications.mjs
      - node apps/web/scripts/session-actions.mjs
      - node apps/web/scripts/terminal-tabs.mjs
      - node apps/web/scripts/user-messages.mjs
      - node apps/web/scripts/sidebar.mjs
      - node apps/web/scripts/workspace-layout.mjs
      - node apps/web/scripts/multiple-hosts.mjs

  check:product-conversation:
    desc: Native REPL, skill completion and chat presentation in Chromium and Firefox
    cmds:
      - task: web-assets
      - node --test apps/web/scripts/native-safari-driver.test.mjs
      # These maintained entrypoints require their native fixture ports at cutover.
      - node apps/web/scripts/repl-viewer.mjs
      - node apps/web/scripts/slash-skills.mjs
      - node apps/web/scripts/chat-polish.mjs

  check:product-ui:
    desc: UI browser behavior, exact CSP, packed consumer and model picker geometry
    cmds:
      - npm run build -w @whip/sdk
      - npm run build:storybook -w @whip/ui
      - node packages/ui/tests/browser.mjs
      - node packages/ui/tests/csp.mjs
      - node packages/ui/tests/packed.mjs
      - node packages/ui/tests/workspace-tabs.mjs
      - node packages/ui/tests/workspace-layout.mjs
      - node apps/web/scripts/model-picker.mjs

  check:product-safari:
    desc: Explicit macOS Safari application acceptance; run manually with a visible Safari session
    platforms: [darwin]
    cmds:
      - task: web-assets
      - node apps/web/scripts/safari.mjs
      - node packages/ui/tests/csp.mjs

  check:product-performance:
    desc: Native web performance measurement; run without competing builds or tests
    cmds:
      - node --test apps/web/scripts/performance-retention.test.mjs apps/web/scripts/performance-keyboard.test.mjs
      - task: web-assets
      - node apps/web/scripts/performance.mjs

  check:product-content:
    desc: Native scoped content and bounded canonical history in Chromium and Firefox
    cmds:
      - task: web-assets
      - node apps/web/scripts/native-content-probes.mjs
      - node apps/web/scripts/attachment-confirmation.mjs
      - node apps/web/scripts/mermaid-diagrams.mjs
      - node --test --test-concurrency=1 apps/web/scripts/native-history-fixture.test.mjs apps/web/scripts/native-tool-output.test.mjs apps/web/scripts/native-history-window.test.mjs
      - node apps/web/scripts/history-prefetch.mjs
      - node apps/web/scripts/native-history-recovery.mjs
      - node apps/web/scripts/reading-position.mjs

  check:product-activity:
    desc: Native operation chronology, child activity, steering and queue workflows
    cmds:
      - task: web-assets
      - node --test --test-concurrency=1 apps/web/scripts/native-activity-response.test.mjs apps/web/scripts/native-queue-fixture.test.mjs
      - node apps/web/scripts/native-chat-activity.mjs
      - node apps/web/scripts/composer-queue.mjs
      - node apps/web/scripts/agent-dock.mjs
      - node apps/web/scripts/turn-failures.mjs
      - node apps/web/scripts/permission-requests.mjs
      - node apps/web/scripts/standing-grants.mjs

  check:product-settings:
    desc: Native Settings, provider connections, stored conversation and REPL workflows
    cmds:
      - task: web-assets
      - node apps/web/scripts/settings.mjs
      - node apps/web/scripts/provider-connections.mjs
      - node apps/web/scripts/external-browser-controls.mjs
      - node apps/web/scripts/settings-conversation.mjs
      - node apps/web/scripts/model-budgets.mjs
      - node apps/web/scripts/claude-code-theme.mjs

  check:product-distributions:
    desc: Disposable native pinned install, restart, update and packaged browser acceptance
    cmds:
      - task: web-assets
      - python3 scripts/test-install-whipcode.py
      - python3 scripts/test-publish-whipcode.py
      - PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-distributions-unit.py
      - node --test scripts/build-installers.test.mjs
      - task: test:update-local
      - task: test:onboarding-docker
      - python3 scripts/test-distributions.py --browser

  check:product-evals:
    desc: Native evaluation contracts, frozen analysis and real Linux observer qualification
    cmds:
      - sh evals/check-native.sh

  check:product-examples:
    desc: Native packed SDK and agent/browser/Node examples against a disposable real host
    cmds:
      - task: web-assets
      - node packages/sdk/scripts/package-smoke.mjs
      - npm run check -w @whip/agents-example
      - npm run acceptance -w @whip/agents-example
      - npm run check -w @whip/client-example
      - npm run smoke -w @whip/client-example

  check:product-docs:
    desc: Native public SDK examples and static documentation
    cmds:
      - npm run check -w @whip/protocol
      - npm run build -w @whip/sdk
      - npm run check:docs
      - npm run test:docs
      - npm run test:docs:dev
      - npm run build:docs
      - npm run test:docs:browser
      - npm run build:storybook:docs

  check:product-mobile:
    desc: Mobile types, UI, real native backend lifecycle and both platform bundles
    cmds:
      - npm run check:mobile
      - npm run test:mobile
      - npm run test:backend -w @whip/mobile
      - task: web-assets
      - node --test apps/mobile/scripts/fixture.test.mjs
      - (cd apps/mobile && EXPO_OFFLINE=1 npx --yes expo-doctor@1.20.4)
      - npm run export:mobile

  check:product-desktop:
    desc: Apple Silicon desktop types, distribution, disposable packaging and staged acceptance
    platforms: [darwin/arm64]
    env:
      WHIP_ONBOARDING_SMOKE_OUTPUT: '{{.ROOT_DIR}}/test-results/redesign/desktop/onboarding.json'
      WHIP_DESKTOP_SMOKE_OUTPUT: '{{.ROOT_DIR}}/test-results/redesign/desktop/workspace.json'
      WHIP_DESKTOP_SMOKE_ARTIFACTS: '{{.ROOT_DIR}}/test-results/redesign/desktop/workspace'
      WHIP_DESKTOP_TERMINAL_ARTIFACTS: '{{.ROOT_DIR}}/test-results/redesign/desktop/terminal'
      WHIP_EDITOR_IPC_SMOKE_OUTPUT: '{{.ROOT_DIR}}/test-results/redesign/desktop/editor-ipc.json'
    cmds:
      - npm run check:desktop
      - npm run test:desktop
      - node --test apps/desktop/scripts/onboarding-fixture.test.mjs
      - |
        if [ '{{.RENDERER_READY | default "false"}}' = true ]; then
          node scripts/pack-web.mjs --release
          npm run package:desktop -- --renderer-ready
        else
          npm run package:desktop
        fi
      - node apps/desktop/scripts/verify.mjs apps/desktop/out/Whip-darwin-arm64/Whip.app
      - WHIP_DESKTOP_SSH_TEST_EXECUTABLE="$PWD/apps/desktop/.stage/native/whipcode" npm run test:desktop
      - BROWSER_NATIVE_DAEMON=1 node apps/desktop/scripts/browser-native.mjs
      - node apps/desktop/scripts/onboarding-smoke.mjs
      - node apps/desktop/scripts/smoke.mjs
      - WHIP_WEB_TURN_FAILURE_FIXTURE=1 node apps/desktop/scripts/smoke.mjs
      - node apps/desktop/scripts/terminal-smoke.mjs
      - node apps/desktop/scripts/project-editors-ipc-smoke.mjs

  check:native-cli:
    desc: Native lifecycle and CLI fixtures, plus terminal client regressions
    cmds:
      - mkdir -p test-results/go
      # Protocol clients have independent real-host lifecycles. Keep the same
      # deadline per family without growing one aggregate timer with each client.
      - go test -coverprofile=test-results/go/client-1.out -race -shuffle=on -count=1 -timeout=3m ./cmd/whip -run '^Test(Auth|OpenAIAuth|DeviceLogin|ProviderChoice|CLIChooser|TerminalKeyPrompt)'
      - go test -coverprofile=test-results/go/client-2.out -race -shuffle=on -count=1 -timeout=3m ./cmd/whip -run '^Test(Daemon|Desktop)'
      - go test -coverprofile=test-results/go/client-3.out -race -shuffle=on -count=1 -timeout=3m ./cmd/whip -run '^TestRun'
      - go test -coverprofile=test-results/go/client-4.out -race -shuffle=on -count=1 -timeout=3m ./cmd/whip -run '^Test(Native|Web|Headless|Sessions|TruncAndAgo|PushOTLP|MainDispatchesHeadlessCommands|ClientEntryPaths|DistributionMalformed)'
      - go test -coverprofile=test-results/go/client-5.out -race -shuffle=on -count=1 -timeout=3m ./cmd/whip -run '^Test(MCP|Acp|ACP)'
      - go test -coverprofile=test-results/go/client-6.out -race -shuffle=on -count=1 -timeout=3m ./cmd/whip -run '^Test(Update|DistributionUpdate)'
      - go test -tags=integration -count=1 -timeout=2m ./cmd/whip -run '^TestNativeCompiledCLI'
      - go test -coverprofile=test-results/go/client-7.out -race -tags=integration -count=1 -timeout=3m ./cmd/whip -run '^TestDesktopCompiledUpdate$'
      - go test -coverprofile=test-results/go/cli-integration.out -race -shuffle=on -tags=integration -count=1 -timeout=3m ./cmd/whip -run '^Test(NativeCompiledBenchmark|Desktop(SSH|Askpass|PromptSocket))'
      # Keep all native and pure presentation tests with independent unchanged deadlines.
      - go test -coverprofile=test-results/go/client-8.out -race -shuffle=on -count=1 -timeout=3m ./internal/tui -run '^TestNative[A-L]'
      - go test -coverprofile=test-results/go/client-9.out -race -shuffle=on -count=1 -timeout=3m ./internal/tui -run '^TestNative' -skip '^TestNative[A-L]'
      - go test -coverprofile=test-results/go/client-10.out -race -shuffle=on -count=1 -timeout=3m ./internal/tui -skip '^TestNative'
      # Complements every family above, including new test names and examples.
      - go test -coverprofile=test-results/go/cli-rest.out -race -shuffle=on -count=1 -timeout=3m ./cmd/whip -skip '{{.CLI_FAMILIES}}'
      - go vet ./cmd/whip

  check:change:
    desc: Complete native Go, contract and client integration gate (run npm ci first)
    cmds:
      - task: check:build
      - task: check:race-store
      - task: check:race-runtime
      - task: check:race-other
      - task: check:clients
      - task: check:native-browser

  check:native-browser:
    desc: Actual owned Chrome, retained driver/lifecycle parity, and both worker engines (install private test Chrome first)
    cmds:
      - mkdir -p test-results/go
      - |
        native_browser_binary="${WHIP_BROWSER_NATIVE_TEST_BINARY:-}"
        if [ -z "$native_browser_binary" ]; then
          native_browser_binary=$(node --input-type=module -e 'import { chromium } from "@playwright/test"; process.stdout.write(chromium.executablePath())') || exit $?
        fi
        case "$native_browser_binary" in
          /*) ;;
          *) echo 'Native browser gate requires an absolute Chrome executable path' >&2; exit 1 ;;
        esac
        if [ ! -x "$native_browser_binary" ]; then
          echo 'Native browser gate requires an installed Chrome executable; run npx playwright install chromium' >&2
          exit 1
        fi
        WHIP_BROWSER_NATIVE_TEST_BINARY="$native_browser_binary" WHIP_BROWSER_NATIVE_TEST_HEADED=1 go test -coverprofile=test-results/go/native-browser.out -p=2 -race -shuffle=on -count=1 -timeout=3m ./internal/browser ./internal/runtime -run '^Test(NativeHeadlessOwnedProcess|E2EHeadless|E2EDedicated|E2ELiveAttach|EvalImmediatelyAfterAttach|DriverParity|ConcurrentSessionsDriveIsolatedBrowsers|ChurnOpenClose|RecoverFromClosedBrowserRequiresExplicitGeneration|ManySequentialCalls|ExternalBrowserOwnedHeadlessUploadAndScreenshot|ExternalBrowserBothEnginesRestartKeepsValuesWithoutControl)$'

  check:fixture:
    desc: Production native runtime, SDK admission, crash recovery and process-lifetime checks
    cmds:
      - npm run build
      - node --test --test-concurrency=1 scripts/redesign/v4-fixture.test.mjs
      - node --test --test-concurrency=1 scripts/redesign/gateway-fixture.test.mjs
      - node --test --test-concurrency=1 scripts/redesign/executor-fixture.test.mjs
      - node --test --test-concurrency=1 scripts/redesign/shell-fixture.test.mjs
      - node --test --test-concurrency=1 scripts/redesign/computer-fixture.test.mjs
      - node --test --test-concurrency=1 scripts/redesign/desktop-seed-fixture.test.mjs
      - node --test --test-concurrency=1 scripts/redesign/browser-provider-fixture.test.mjs
      - WHIP_TEST_SELFHOST=1 go test -race -shuffle=on -count=1 -timeout=150s ./internal/mcp -run '^Test(ServeSelfHost|StdioServerEndToEnd)$'
      - |
        fixture=$(mktemp -d "${TMPDIR:-/tmp}/whip-runtime-gate.XXXXXX")
        trap 'rm -rf "$fixture"' EXIT HUP INT TERM
        go build -o "$fixture/whipcode" ./cmd/whip
        WHIP_RLM_TEST_EXECUTABLE="$fixture/whipcode" go test -race -shuffle=on -tags=integration -count=1 -timeout=2m ./internal/engine/process -run '^TestPackagedRuntime$'

  check:analysis:
    desc: Pinned lint against the frozen baseline and reachable-vulnerability checks over the complete module
    vars:
      TOOLCHAIN:
        sh: go env GOVERSION
    env:
      GOTOOLCHAIN: '{{.TOOLCHAIN}}'
    cmds:
      - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1 run --new-from-rev={{.LINT_BASELINE}} ./...
      - go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - go mod tidy
      - git diff --exit-code -- go.mod go.sum

  check:phase:
    desc: Complete native milestone gate for this host; CI also requires the supported OS matrix
    cmds:
      - task: ci

  check:invariants:
    desc: Durable acceptance, child restart, single dispatch, settlement repair and nonblocking execution
    cmds:
      - go test -race -shuffle=on -count=1 -timeout=3m ./internal/store -run '^(TestAttemptAdmissionAndSingleDispatchAcrossConnections|TestAttemptSettlementAndTranscriptCommitAtomicallyAndRetryExactly|TestAttemptRecoveryDistinguishesUndispatchedFromUncertainAndRollsBack|TestReceiptMatchNeverAdmitsAndKeepsPayloadProofAcrossDeletionAndRestart)$'
      - go test -race -shuffle=on -count=1 -timeout=3m ./internal/runtime -run '^(TestReadingQueuedHistoryDoesNotExecuteAndRestartResumes|TestObserverCancellationAndExplicitCancellationHaveDifferentLifetimes|TestChildAdmissionSurvivesRestartWithoutLoadedWorker|TestStructuredOutputSQLSettlementRetryDoesNotReplayProvider|TestSlowProviderDoesNotBlockDurableCancellation|TestWorkerCapacityYieldPreservesOwnershipAndAlternatesAdmission|TestWorkerCapacityCancellationDuringWaitAndResumption)$'

  dev:fixture:
    desc: Disposable native web/mobile product fixture (-- --minutes=1..30)
    cmds:
      - task: web-assets
      - node apps/mobile/scripts/fixture.mjs {{.CLI_ARGS}}

  dev:v4:
    desc: Disposable scripted runtime (pass -- -directory /private/disposable/path)
    cmds:
      - go run ./cmd/whip-runtime -scripted {{.CLI_ARGS}}

  acceptance:
    desc: Native durable invariants, every compiled process/client fixture and packaged SDK acceptance
    cmds:
      - task: check:invariants
      - task: check:fixture
      - task: check:product-examples

  contract:
    desc: "Validate generated Node 24 contracts and deterministic generation (run npm ci first)"
    cmds:
      - npm run check -w @whip/protocol

  sdk:
    desc: "Build and test the TypeScript SDK, synchronized views, and React example"
    cmds:
      - npm run check -w @whip/sdk
      - npm run build -w @whip/client-example
      - npm run check -w @whip/agents-example

  check:
    desc: "Whole-module format, vet and regressions plus native contracts and web checks"
    cmds:
      - task: models:check
      - |
        unformatted=$(gofmt -s -l .)
        if [ -n "$unformatted" ]; then
          echo "needs gofmt -s:"; echo "$unformatted"; exit 1
        fi
      - go vet ./...
      - go run ./cmd/whipvet ./...
      - go test ./...
      - task: contract
      - task: sdk
      - task: web
      - task: test:update-local
      - task: test:onboarding-docker

  models:update:
    desc: Update bundled Models.dev metadata and desktop provider key names
    cmds:
      - go run ./cmd/modelgen {{.CLI_ARGS}}

  models:check:
    desc: Validate bundled model metadata and generated provider names offline
    cmds:
      - go run ./cmd/modelgen -check

  lint:
    desc: "golangci-lint with the repo's .golangci.yml (the CI lint gate)"
    cmds:
      - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1 run --new-from-rev={{.LINT_BASELINE}} ./...

  lint-fix:
    desc: "golangci-lint with auto-fix"
    cmds:
      - golangci-lint run --fix ./...

  vuln:
    desc: "govulncheck: reachable known-vulnerability scan (the CI security gate)"
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  ci:
    desc: Complete host CI checks; the reusable workflow adds the OS/build matrix and explicit platform jobs
    cmds:
      - task: check:change
      - task: check:analysis
      - task: check:product-web
      - task: check:product-browser
      - task: check:product-performance
      - task: check:product-conversation
      - task: check:product-ui
      - task: check:product-content
      - task: check:product-activity
      - task: check:product-settings
      - task: check:product-distributions
      - task: check:product-examples
      - task: check:product-evals
      - task: check:product-docs
      - task: check:product-mobile
      - task: check:product-desktop
      - task: driver-test

  hooks:
    desc: "Enable the repo's git hooks (sets core.hooksPath to scripts/git-hooks)"
    cmds:
      - git config core.hooksPath scripts/git-hooks
      - chmod +x scripts/git-hooks/*
      - echo "git hooks enabled (pre-commit runs gofmt/vet/test + golangci-lint when installed)"

  coverage:
    desc: Run tests with per-package coverage report
    cmds:
      - go test -cover ./...

  fmt:
    desc: Format code
    cmds:
      - gofmt -s -w .

  vet:
    desc: Vet code (go vet + whipvet, the TUI event-loop deadlock analyzer)
    cmds:
      - go vet ./...
      - go run ./cmd/whipvet ./...

  tidy:
    desc: Tidy go.mod
    cmds:
      - go mod tidy

  driver:
    desc: "Build the whip-computer Swift driver (macOS; Xcode CLT) and copy it into internal/computer/bin for go:embed"
    cmds:
      - swift build -c release --package-path driver
      - cp driver/.build/release/whip-computer internal/computer/bin/whip-computer
      - codesign --sign - --force internal/computer/bin/whip-computer 2>/dev/null || true
      - echo "driver built → internal/computer/bin/whip-computer (rebuild whip to re-embed)"

  driver-test:
    platforms: [darwin]
    desc: "Run the Swift driver XCTest suite (needs full Xcode — XCTest isn't in CLT)"
    cmds:
      - swift test --package-path driver
