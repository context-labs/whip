version: "3"

vars:
  VERSION:
    sh: printf 'dev+%s' "$(git rev-parse --short HEAD 2>/dev/null || echo unknown)"
  LDFLAGS: -X main.version={{.VERSION}}
  # Fast domain/runtime checks; all tests in these packages are required.
  REDESIGN_PACKAGES: ./evals/rlm ./internal/modelcatalog ./internal/runtimepath ./internal/update ./internal/clientnotes ./internal/acp ./internal/imageutil ./internal/browser ./internal/browser/extrelay ./internal/browserhost ./internal/trace ./internal/computer ./internal/computerconfig ./internal/helperprogram ./internal/hostview ./internal/theme ./internal/terminal ./internal/mcp ./internal/mcpconfig ./internal/jsonc ./internal/secretref ./internal/brandicon ./internal/gateway ./internal/webassets ./internal/executor ./internal/bashrun ./internal/shell ./internal/schedule ./internal/content ./internal/session ./internal/hostmodule ./internal/store ./internal/config ./internal/protocol ./internal/model ./internal/openaiauth ./internal/inferenceauth ./internal/inferenceaccount ./internal/providerhost ./internal/account ./internal/runner ./internal/tool ./internal/instruction ./internal/skills ./internal/capability ./internal/lsp ./internal/lspconfig ./internal/workspace ./internal/runtime ./internal/rpc ./internal/client ./internal/runclient ./internal/localruntime ./internal/hostcmd ./internal/engine ./internal/engine/quickjs ./cmd/whip-contract ./cmd/whip-runtime ./cmd/modelgen
  # Process containment stress tests run in full at the change/CI boundary.
  REDESIGN_INTEGRATION_PACKAGES: ./internal/engine/process
  REDESIGN_ALL_PACKAGES: '{{.REDESIGN_PACKAGES}} {{.REDESIGN_INTEGRATION_PACKAGES}}'
  REDESIGN_BASELINE: e3fed9c91918d9c36766dd47d878c1b5466238d1

tasks:
  default:
    cmds: [task --list]
    silent: true

  run:
    desc: "Run whipcode locally from source (pass flags via CLI_ARGS: task run -- -m glm-5.2-fast)"
    interactive: true
    deps: [web-assets]
    cmds:
      - go run -ldflags "{{.LDFLAGS}}" ./cmd/whip {{.CLI_ARGS}}

  build:
    desc: Build whipcode with the web app into ./whipcode (run npm ci first)
    deps: [web-assets]
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o whipcode ./cmd/whip

  update:local:
    desc: Build, sign and install local macOS Desktop + whipcode, then restart the shared daemon
    cmds:
      - node scripts/update-local.mjs {{.CLI_ARGS}}

  test:update-local:
    desc: Test local installation staging and failure recovery with disposable files
    cmds:
      - node --test scripts/update-local.test.mjs

  onboarding:docker:
    desc: Build working files and open a disposable TUI + web app at localhost:4000
    interactive: true
    cmds:
      - node scripts/onboarding-docker.mjs {{.CLI_ARGS}}

  test:onboarding-docker:
    desc: Test Docker onboarding orchestration and local renderer provenance
    cmds:
      - node --test scripts/onboarding-docker.test.mjs scripts/renderer-artifact.test.mjs

  install:
    desc: Install whipcode with the web app to GOBIN or GOPATH/bin
    deps: [build]
    cmds:
      - |
        dest=$(go env GOBIN)
        if [ -z "$dest" ]; then dest="$(go env GOPATH)/bin"; fi
        mkdir -p "$dest"
        install -m 755 whipcode "$dest/whipcode"

  web-assets:
    desc: Build and package the production web app for go:embed
    cmds:
      - npm run build:web
      - node scripts/pack-web.mjs

  web:
    desc: Check web types, production assets, component tests and theme generation drift
    cmds:
      - go run ./cmd/themegen -check
      - npm run check:web
      - npm run test:web
      - npm run check -w @whip/ui
      - npm run test -w @whip/ui
      - node --test scripts/pack-web.test.mjs
      - node --test apps/web/scripts/stylex-dev.test.mjs
      - node --test apps/web/scripts/dev-proxy.test.mjs

  benchmark:
    desc: "Benchmark startup: binary boot (--version) and read-only native declarations/selection (-bench); no credentials or network"
    deps: [build]
    cmds:
      - |
        if command -v hyperfine >/dev/null 2>&1; then
          hyperfine -N --warmup 5 './whipcode --version' './whipcode -bench'
        else
          for cmd in "./whipcode --version" "./whipcode -bench"; do
            start=$(date +%s%N)
            for i in $(seq 1 50); do $cmd >/dev/null; done
            end=$(date +%s%N)
            echo "$cmd: $(( (end - start) / 50 / 1000000 )).$(( (end - start) / 50 / 100000 % 10 )) ms avg (50 runs)"
          done
        fi

  test:
    desc: Run all tests
    cmds:
      - go test ./...

  check:fast:
    desc: Redesign active-package formatting and regression tests (no npm setup needed)
    cmds:
      - |
        unformatted=$(gofmt -s -l {{.REDESIGN_ALL_PACKAGES}})
        if [ -n "$unformatted" ]; then
          echo "$unformatted"
          exit 1
        fi
      # The runtime package now contains over 180 integration tests. Its total
      # deadline is separate from fast leaf packages and individual scenario waits.
      - |
        set -- {{.REDESIGN_PACKAGES}}
        packages=""
        for package in "$@"; do
          if [ "$package" != "./internal/runtime" ]; then
            packages="$packages $package"
          fi
        done
        go test -timeout=2m $packages
      - go test -timeout=5m ./internal/runtime
      - go build {{.REDESIGN_INTEGRATION_PACKAGES}}

  check:build:
    desc: Redesign formatting, fast regressions, active build and vet
    cmds:
      - task: check:fast
      # Compile test-only eval packages too; they intentionally export no library.
      - go test -run '^$' {{.REDESIGN_ALL_PACKAGES}}
      - go vet {{.REDESIGN_ALL_PACKAGES}}

  check:race:
    desc: Complete redesign race and shuffle suite with bounded package concurrency
    cmds:
      # SQLite and subprocess race suites are CPU/memory intensive. Preserve
      # every package and its deadline, while limiting competing test binaries.
      - go test -p=2 -race -shuffle=on -count=1 -timeout=10m {{.REDESIGN_ALL_PACKAGES}}

  check:race-store:
    desc: Complete SQL store race suite in complementary bounded groups
    cmds:
      - task: check:race-store-first
      - task: check:race-store-rest

  check:race-store-first:
    desc: SQL store race tests whose names begin TestA through TestM
    cmds:
      - go test -p=2 -race -shuffle=on -count=1 -timeout=10m -run '^Test[A-M]' ./internal/store

  check:race-store-rest:
    desc: Every other SQL store test and example under the race detector
    cmds:
      # Complement the first group, including newly added test names/examples.
      - go test -p=2 -race -shuffle=on -count=1 -timeout=10m -skip '^Test[A-M]' ./internal/store

  check:race-runtime:
    desc: Complete runtime race suite in complementary bounded groups
    cmds:
      - task: check:race-runtime-first
      - task: check:race-runtime-rest

  check:race-runtime-first:
    desc: Runtime race tests whose names begin TestA through TestM
    cmds:
      - go test -p=2 -race -shuffle=on -count=1 -timeout=10m -run '^Test[A-M]' ./internal/runtime

  check:race-runtime-rest:
    desc: Every other runtime test and example under the race detector
    cmds:
      # Complement the first group, including newly added test names/examples.
      - go test -p=2 -race -shuffle=on -count=1 -timeout=10m -skip '^Test[A-M]' ./internal/runtime

  check:race-other:
    desc: Complete race suite for every remaining active package
    vars:
      OTHER_PACKAGES:
        sh: |
          for package in {{.REDESIGN_ALL_PACKAGES}}; do
            case "$package" in
              ./internal/store|./internal/runtime) ;;
              *) printf '%s ' "$package" ;;
            esac
          done
    cmds:
      - go test -p=2 -race -shuffle=on -count=1 -timeout=10m {{.OTHER_PACKAGES}}

  check:clients:
    desc: Generated contracts, SDK/examples, real-process clients and retained regressions
    cmds:
      - task: contract
      - task: sdk
      - task: check:native-cli
      - task: check:fixture
      - task: check:retained

  check:product-web:
    desc: Shared app, web assets, UI and browser support regressions
    cmds:
      - task: web

  check:product-browser:
    desc: Native production web acceptance in Chromium and Firefox
    cmds:
      - task: web-assets
      - node --test --test-concurrency=1 apps/web/scripts/native-fixture.test.mjs apps/web/scripts/native-stream-fixture.test.mjs apps/web/scripts/native-performance-fixture.test.mjs
      - node apps/web/scripts/browser.mjs
      - node apps/web/scripts/snapshot-refresh.mjs
      - node apps/web/scripts/session-search.mjs
      - node apps/web/scripts/session-tabs.mjs
      - node apps/web/scripts/user-messages.mjs
      - node apps/web/scripts/sidebar.mjs
      - node apps/web/scripts/workspace-layout.mjs
      - node apps/web/scripts/multiple-hosts.mjs

  check:product-content:
    desc: Native scoped content and bounded canonical history in Chromium and Firefox
    cmds:
      - task: web-assets
      - node apps/web/scripts/native-content-probes.mjs
      - node apps/web/scripts/attachment-confirmation.mjs
      - node --test --test-concurrency=1 apps/web/scripts/native-history-fixture.test.mjs apps/web/scripts/native-tool-output.test.mjs apps/web/scripts/native-history-window.test.mjs
      - node apps/web/scripts/history-prefetch.mjs
      - node apps/web/scripts/native-history-recovery.mjs
      - node apps/web/scripts/reading-position.mjs

  check:product-activity:
    desc: Native operation chronology, child activity, steering and queue workflows
    cmds:
      - task: web-assets
      - node --test --test-concurrency=1 apps/web/scripts/native-activity-response.test.mjs apps/web/scripts/native-queue-fixture.test.mjs
      - node apps/web/scripts/native-chat-activity.mjs
      - node apps/web/scripts/composer-queue.mjs
      - node apps/web/scripts/agent-dock.mjs

  check:product-settings:
    desc: Native Settings, provider connections, stored conversation and REPL workflows
    cmds:
      - task: web-assets
      - node apps/web/scripts/settings.mjs
      - node apps/web/scripts/provider-connections.mjs
      - node apps/web/scripts/settings-conversation.mjs

  check:product-distributions:
    desc: Disposable native pinned install, restart, update and packaged browser acceptance
    cmds:
      - task: web-assets
      - python3 scripts/test-distributions.py --browser

  check:product-evals:
    desc: Native evaluation contracts, frozen analysis and real Linux observer qualification
    cmds:
      - sh evals/check-native.sh

  check:product-examples:
    desc: Native packed SDK and agent/browser/Node examples against a disposable real host
    cmds:
      - task: web-assets
      - node packages/sdk/scripts/package-smoke.mjs
      - npm run check -w @whip/agents-example
      - npm run acceptance -w @whip/agents-example
      - npm run check -w @whip/client-example
      - npm run smoke -w @whip/client-example

  check:product-docs:
    desc: Native public SDK examples and static documentation
    cmds:
      - npm run check -w @whip/protocol
      - npm run build -w @whip/sdk
      - npm run check:docs
      - npm run test:docs
      - npm run build:docs

  check:product-mobile:
    desc: Mobile types, UI, real native backend lifecycle and both platform bundles
    cmds:
      - npm run check:mobile
      - npm run test:mobile
      - npm run test:backend -w @whip/mobile
      - task: web-assets
      - node --test apps/mobile/scripts/fixture.test.mjs
      - npm run export:mobile

  check:product-desktop:
    desc: Apple Silicon desktop types, distribution, disposable packaging and staged acceptance
    platforms: [darwin/arm64]
    env:
      WHIP_ONBOARDING_SMOKE_OUTPUT: '{{.ROOT_DIR}}/test-results/redesign/desktop/onboarding.json'
      WHIP_DESKTOP_SMOKE_OUTPUT: '{{.ROOT_DIR}}/test-results/redesign/desktop/workspace.json'
      WHIP_DESKTOP_SMOKE_ARTIFACTS: '{{.ROOT_DIR}}/test-results/redesign/desktop/workspace'
      WHIP_DESKTOP_TERMINAL_ARTIFACTS: '{{.ROOT_DIR}}/test-results/redesign/desktop/terminal'
      WHIP_EDITOR_IPC_SMOKE_OUTPUT: '{{.ROOT_DIR}}/test-results/redesign/desktop/editor-ipc.json'
    cmds:
      - npm run check:desktop
      - npm run test:desktop
      - node --test apps/desktop/scripts/onboarding-fixture.test.mjs
      - npm run package:desktop
      - BROWSER_NATIVE_DAEMON=1 node apps/desktop/scripts/browser-native.mjs
      - node apps/desktop/scripts/onboarding-smoke.mjs
      - node apps/desktop/scripts/smoke.mjs
      - WHIP_WEB_TURN_FAILURE_FIXTURE=1 node apps/desktop/scripts/smoke.mjs
      - node apps/desktop/scripts/terminal-smoke.mjs
      - node apps/desktop/scripts/project-editors-ipc-smoke.mjs

  check:native-cli:
    desc: Native lifecycle and CLI fixtures, plus terminal client regressions
    cmds:
      # Protocol clients have independent real-host lifecycles. Keep the same
      # deadline per family without growing one aggregate timer with each client.
      - go test -race -shuffle=on -count=1 -timeout=3m ./cmd/whip -run '^Test(Auth|OpenAIAuth|DeviceLogin|ProviderChoice|CLIChooser|TerminalKeyPrompt)'
      - go test -race -shuffle=on -count=1 -timeout=3m ./cmd/whip -run '^Test(Daemon|Desktop)'
      - go test -race -shuffle=on -count=1 -timeout=3m ./cmd/whip -run '^TestRun'
      - go test -race -shuffle=on -count=1 -timeout=3m ./cmd/whip -run '^Test(Native|Web|Headless|Sessions|TruncAndAgo|PushOTLP|MainDispatchesHeadlessCommands|ClientEntryPaths|DistributionMalformed)'
      - go test -race -shuffle=on -count=1 -timeout=3m ./cmd/whip -run '^Test(MCP|Acp|ACP)'
      - go test -race -shuffle=on -count=1 -timeout=3m ./cmd/whip -run '^Test(Update|DistributionUpdate)'
      - go test -tags=integration -count=1 -timeout=2m ./cmd/whip -run '^TestNativeCompiledCLI'
      - go test -race -tags=integration -count=1 -timeout=3m ./cmd/whip -run '^TestDesktopCompiledUpdate$'
      - go test -race -shuffle=on -count=1 -timeout=3m ./internal/tui
      - go vet ./cmd/whip

  check:change:
    desc: Redesign integration gate (run npm ci first)
    cmds:
      - task: check:build
      - task: check:race
      - task: check:clients

  check:fixture:
    desc: New v4 runtime and retained legacy reference, SDK admission and process-restart checks
    cmds:
      - npm run build
      - node --test --test-concurrency=1 scripts/redesign/v4-fixture.test.mjs
      - node --test --test-concurrency=1 scripts/redesign/gateway-fixture.test.mjs
      - node --test --test-concurrency=1 scripts/redesign/executor-fixture.test.mjs
      - node --test --test-concurrency=1 scripts/redesign/shell-fixture.test.mjs
      - node --test --test-concurrency=1 scripts/redesign/computer-fixture.test.mjs
      - node --test --test-concurrency=1 scripts/redesign/desktop-seed-fixture.test.mjs
      - node --test --test-concurrency=1 scripts/redesign/browser-provider-fixture.test.mjs
      - node --test --test-concurrency=1 scripts/redesign/fixture.test.mjs

  check:analysis:
    desc: Pinned lint and reachable-vulnerability checks for redesign active packages
    vars:
      REDESIGN_TOOLCHAIN:
        sh: go env GOVERSION
    env:
      GOTOOLCHAIN: '{{.REDESIGN_TOOLCHAIN}}'
    cmds:
      - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1 run --new-from-rev={{.REDESIGN_BASELINE}} {{.REDESIGN_ALL_PACKAGES}} ./cmd/whip
      - go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 {{.REDESIGN_ALL_PACKAGES}} ./cmd/whip

  check:phase:
    desc: Redesign milestone gate; expands with supported capabilities
    cmds:
      - task: check:change

  check:retained:
    desc: Selected retained acceptance, restart and accounting invariants
    cmds:
      - go test -race -shuffle=on -count=1 -timeout=3m ./internal/daemon -run '^(TestClientAcceptancePrecedesProviderConstructionAndSurvivesDisconnect|TestQueuedInitialAgentPromptSurvivesRestartExactlyOnce|TestModelAccountingFailureRetriesSettlementWithoutProviderReplay|TestModelAdmissionWaitingForActorDoesNotHoldAccountingLock)$'

  dev:redesign:
    desc: Retained legacy product fixture (-- --minutes=1..30)
    cmds:
      - npm run build
      - WHIP_SDK_AGENTS_FIXTURE=1 node apps/mobile/scripts/fixture.mjs {{.CLI_ARGS}}

  dev:v4:
    desc: New scripted runtime (pass -- -directory /private/disposable/path)
    cmds:
      - go run ./cmd/whip-runtime -scripted {{.CLI_ARGS}}

  acceptance:
    desc: "Run the deterministic daemon, recursive-agent, client, and RLM release acceptance suite"
    cmds:
      - go test -race -tags=integration ./internal/tui -run '^TestInteractiveSessionOverTrustedProtocol$'
      - go test -race -tags=integration ./internal/daemon -run '^TestRecursiveAgent(ReceiptsWithLargeMCPGrants|GrantInspectionAccess)$'
      - go test -race ./internal/daemon ./internal/legacy/session ./internal/legacy/protocol -run '^(TestV2|TestV3|TestTrustedClient|TestRuntimeRegistry|TestCommandAcceptance|TestClientAcceptance|TestDeleteAcceptance|TestQuestionSnapshot|TestRootCollection|TestSessionCatalog|TestIncompatible|TestVersionFive|TestVersionSix|TestBounded|TestTranscriptPage)'
      - go test -race ./internal/mcp ./internal/tools ./internal/legacy/session ./internal/daemon ./internal/acp ./internal/tui -run '^(TestMCP|TestExternalPermission|TestCheckedManager|TestConfigTrust|TestConfigDiscoveryReportsWinningProvenance|TestManagerOwnsConfigMapsAndNeverTrustsSourceLabels|TestCapabilityFinishStorageFailureSettlesAndReleasesCapacity|TestCapabilityFinishDeniedSettlesAdmittedOperation|TestBridgeMCP)'
      - go test -race ./internal/daemon -run '^(TestRuntimeAcceptance.*|TestRuntimePathsAndOwnerLock|TestOwnerOnlySocketRefusesUnsafeState|TestArchitecture.*|TestRecursiveRuntimeUsesOneInterfaceAtEveryDepth|TestRecursiveSpawnQueuesUnderWorkerPressure|TestRecursiveChildrenInheritOrExplicitlyOverrideOneAgentConfiguration|TestRecursiveAgentClientControlsAuthorizeAndPersist|TestRecursiveRuntimeRestoresRetainedAgentAndTranscript|TestQueuedInitialAgentPromptSurvivesRestartExactlyOnce|TestConcurrentChildTurnPressureKeepsPromptQueued|TestSuspendedKernelNoticeIsEphemeral|TestSuspendedKernelRestoresScratchWithEphemeralNotice|TestBackgroundShellJobOutlivesTheCellAndTurn|TestToolHostRunsOnlyRestrictedToolCommands|TestPermissionRuleResolvesCoveredPromptsAndSkipsFutureOnes|TestUserAskRoundTripsThroughQuestionEvents|TestUserAskDismissAndCancelClose|TestUserAskIsRootOnlyAndValidatesArguments)$'
      - go test -race ./internal/legacy/session ./internal/capability ./internal/daemon -run '^(TestRuntimeTransitionIsAtomicAndLargeValuesAreHandleBacked|TestStatePrivateIsolationBlackboardVisibilityAndHandles|TestMailboxMessageIsCanonicalAndBodyStaysBehindRead|TestMailboxTurnDeliversOnCommitAndNewMailStaysPending|TestFailedMailboxTurnRedeliversPendingMail|TestRootMailboxFailureRequiresExplicitInputAcrossRestart|TestRootTurnLifecycleIdentifiesExactTurn|TestMessageDeliveryClassesAndDeferral|TestAgentAdmissionPersistsPromptAtomically|TestRecoveryKeepsQueuedAgentPromptButInterruptsRunningInput|TestChildBudgetClampingDepthAndActiveChildLimits|TestBudgetKindsExhaustIndependently|TestCapabilityPermissionSurvivesDispatcherAndRevalidates|TestDispatcherRunsDirectAndPersistedPermissionThroughOnePath|TestDispatcherRejectsCanonicalPathChangeAfterApproval|TestDispatcherWorkspaceMutationRunsAlongsidePathMutations|TestRecoveryInterruptsEveryNonterminalRuntimeRecord|TestSlowOutboundClientClosesWithoutStoppingDaemon|TestRootsRunConcurrentlyAndCallerCancellationDoesNotOwnWork|TestMCPLifecyclePanicFailsOnlyItsRoot|TestRootClientReconnectsStableCommandWithoutDuplicateEvent|TestRestartReturnsAuthoritativeInterruptedCommandWithoutReexecution)$'
      - go test -race ./internal/tui ./internal/acp ./cmd/whip -run '^(TestClientReconnectReplayAndSnapshotFallback|TestClientReattachesInFlightActionWithSameIdentityAfterDisconnect|TestDaemonBackedModelRendersWithoutAnAgent|TestThinPaletteAndAgentControlsStayDaemonBacked|TestBridgeNativeSessionPromptAndCanonicalReplay|TestBridgePermissionAndModesWithoutCredentials|TestBridgeQuestionMapsToPermissionPromptAndAnswerOp|TestBridgeConcurrentSessionsAndCloseDetach|TestRunDaemonAlwaysUsesRLMRuntime|TestRunTextOutput|TestSessionsCLI|TestMCPServeStopsCleanlyOnStdinEOF|TestMCPTestCLIReady|TestBridgeMCPPermissionKeepsConcreteArguments)$'
      - go test -race ./internal/engine/process -run '^(TestKernelEnforcesStepWallOutputHostAndFrameLimits|TestKernelDeadlineReapsProcessGroup|TestKernelDeniesAmbientAuthority|TestKernelStripsDaemonEnvironment|TestKernelReservationAndCrashRestart|TestKernelManagerSchedulesFIFOWithoutEvictingRunningTurns|TestKernelManagerEvictsIdleWorkersInLRUOrderAcrossRetainedSessions|TestKernelManagerRemovesCancelledWaitersAndWakesOnShutdown|TestKernelTurnLeasePreservesScratchAndSuspendRejectsRunning|TestKernelScratchSurvivesSuspensionAndMidTurnRestart)$'
      - go test -race ./evals/rlm -run '^TestDeterministicRLMEvaluationReport$'
      - WHIP_SDK_RACE=1 npm run acceptance
      - npm run test:package
      - go test -race ./internal/engine/process ./internal/rlm ./internal/legacy/session ./internal/daemon -run '^(TestScratch|TestWorkerSnapshot|TestWorkerRestore|TestWorkerCrossChunk|TestStructuredState|TestStatePages|TestChildScratchSurvivesDaemonRestart|TestPhaseFourAndFiveStoresAreRejectedWithoutMutation)'

      - go test -race ./internal/llm ./internal/legacy/session ./internal/agent ./internal/daemon ./internal/tui -run '^(TestModel|TestPricing|TestUsage|TestStreamPreserves|TestStreamUnterminated|TestCompletePreserves|TestMalformedUsage)'

  contract:
    desc: "Validate generated Node 24 contracts and deterministic generation (run npm ci first)"
    cmds:
      - npm run check -w @whip/protocol
      - npm run check -w @whip/legacy-protocol

  sdk:
    desc: "Build and test the TypeScript SDK, synchronized views, and React example"
    cmds:
      - npm run check -w @whip/sdk
      - npm run check -w @whip/legacy-sdk
      - npm run build -w @whip/client-example
      - npm run check -w @whip/agents-example

  check:
    desc: "Format + vet + test (what the pre-commit hook runs, plus golangci-lint when installed)"
    cmds:
      - task: models:check
      - |
        unformatted=$(gofmt -s -l .)
        if [ -n "$unformatted" ]; then
          echo "needs gofmt -s:"; echo "$unformatted"; exit 1
        fi
      - go vet ./...
      - go run ./cmd/whipvet ./...
      - go test ./...
      - task: contract
      - task: sdk
      - task: web
      - task: test:update-local
      - task: test:onboarding-docker

  models:update:
    desc: Update bundled Models.dev metadata and desktop provider key names
    cmds:
      - go run ./cmd/modelgen {{.CLI_ARGS}}

  models:check:
    desc: Validate bundled model metadata and generated provider names offline
    cmds:
      - go run ./cmd/modelgen -check

  lint:
    desc: "golangci-lint with the repo's .golangci.yml (the CI lint gate)"
    cmds:
      - golangci-lint run ./...

  lint-fix:
    desc: "golangci-lint with auto-fix"
    cmds:
      - golangci-lint run --fix ./...

  vuln:
    desc: "govulncheck: reachable known-vulnerability scan (the CI security gate)"
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  ci:
    desc: "Run the full local CI gate: check + lint + vuln + release acceptance"
    deps: [check, lint, vuln, acceptance]

  hooks:
    desc: "Enable the repo's git hooks (sets core.hooksPath to scripts/git-hooks)"
    cmds:
      - git config core.hooksPath scripts/git-hooks
      - chmod +x scripts/git-hooks/*
      - echo "git hooks enabled (pre-commit runs gofmt/vet/test + golangci-lint when installed)"

  coverage:
    desc: Run tests with per-package coverage report
    cmds:
      - go test -cover ./...

  fmt:
    desc: Format code
    cmds:
      - gofmt -s -w .

  vet:
    desc: Vet code (go vet + whipvet, the TUI event-loop deadlock analyzer)
    cmds:
      - go vet ./...
      - go run ./cmd/whipvet ./...

  tidy:
    desc: Tidy go.mod
    cmds:
      - go mod tidy

  driver:
    desc: "Build the whip-computer Swift driver (macOS; Xcode CLT) and copy it into internal/computer/bin for go:embed"
    cmds:
      - swift build -c release --package-path driver
      - cp driver/.build/release/whip-computer internal/computer/bin/whip-computer
      - codesign --sign - --force internal/computer/bin/whip-computer 2>/dev/null || true
      - echo "driver built → internal/computer/bin/whip-computer (rebuild whip to re-embed)"

  driver-test:
    desc: "Run the Swift driver XCTest suite (needs full Xcode — XCTest isn't in CLT)"
    cmds:
      - swift test --package-path driver
