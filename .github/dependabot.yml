# Keep Go, npm workspace dependencies and GitHub Actions up to date.
# Minor/patch updates are grouped into one PR; major updates get their own PR
# (they may carry breaking changes). Actions are pinned to major versions
# in older workflows; release workflows pin full commit identities.
version: 2

updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    groups:
      gomod-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    # Security updates (separate from the weekly cadence) come through
    # automatically regardless of grouping.

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    groups:
      actions:
        applies-to: version-updates
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    # Native modules whose versions the Expo SDK pins (apps/mobile; checked by
    # `expo-doctor` in mobile.yml). Bumping them past the SDK's pins fails
    # mobile / checks and red-lights the whole grouped PR, so they move only
    # with an Expo SDK upgrade (`npx expo install --fix`), not via Dependabot.
    ignore:
      - dependency-name: "@shopify/flash-list"
      - dependency-name: "react-native"
      - dependency-name: "react-native-gesture-handler"
      - dependency-name: "react-native-keyboard-controller"
      - dependency-name: "react-native-reanimated"
      - dependency-name: "react-native-safe-area-context"
      - dependency-name: "react-native-screens"
      - dependency-name: "react-native-svg"
      - dependency-name: "react-native-worklets"
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
