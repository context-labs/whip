name: mobile

# Called by ci.yml and included in its required aggregate gate. This validates
# JavaScript/native package resolution, not signed binaries or device behavior.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Mobile types and shared SDK build
        run: npm run check:mobile
      - name: Mobile behavior tests
        run: npm run test:mobile
      - name: Expo dependency and configuration checks
        working-directory: apps/mobile
        run: npx --yes expo-doctor@1.20.4
      - name: Production iOS and Android bundle exports
        run: npm run export:mobile
