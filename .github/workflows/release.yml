name: release

# Cut a release by pushing a tag:  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      # internal/browser e2e tests need a real Chromium sandbox and
      # internal/tui tests need a tty — neither exists on hosted runners.
      # Those stay local (task test); the release gate runs the portable set.
      - run: go test $(go list ./... | grep -v -e /internal/browser -e /internal/tui)

  # Each binary is built on a runner of its OWN platform. darwin-arm64 needs
  # macOS anyway: the embedded whip-computer Swift helper (computer-use
  # native tier) is built with `task driver` on the runner and go:embed'd into
  # the whip binary — never committed. Each job smoke-tests `--version` so a
  # broken binary fails here instead of shipping.
  build:
    needs: test
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            asset: whip-linux-x64
            driver: false
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            asset: whip-linux-arm64
            driver: false
          - os: macos-14
            goos: darwin
            goarch: arm64
            asset: whip-darwin-arm64
            driver: true
          # darwin-x64 is cross-built on ubuntu (macOS Intel hosted runners
          # are scarce and stall releases — clocked-in hit this too). Pure-Go
          # cross-compile, no Swift helper on x64: Intel macs get the core
          # CLI with the osascript fallback tier. Can't run a darwin binary
          # on linux, so no smoke here; the arm64 mac job proves the mac path.
          - os: ubuntu-latest
            goos: darwin
            goarch: amd64
            asset: whip-darwin-x64
            driver: false
            smoke: false
    runs-on: ${{ matrix.os }}
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build the whip-computer Swift driver (macOS arm64)
        if: ${{ matrix.driver }}
        run: |
          xcodebuild -version >/dev/null 2>&1 || true # CLT is enough for swift build
          swift build -c release --package-path driver
          cp driver/.build/release/whip-computer internal/computer/bin/whip-computer
          codesign --sign - --force internal/computer/bin/whip-computer 2>/dev/null || true
          test -s internal/computer/bin/whip-computer

      - name: Build ${{ matrix.asset }}
        run: |
          # The zero-byte placeholder keeps non-driver builds green: go:embed
          # reads whatever is at internal/computer/bin/whip-computer.
          mkdir -p dist/release
          go build -trimpath \
            -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o "dist/release/${{ matrix.asset }}" ./cmd/whip

      - name: Smoke test on a clean directory
        if: ${{ matrix.smoke != false }}
        run: |
          bin="$RUNNER_TEMP/${{ matrix.asset }}"
          cp "dist/release/${{ matrix.asset }}" "$bin"
          chmod +x "$bin"
          cd "$RUNNER_TEMP"
          "$bin" --version | grep -F "${{ github.ref_name }}"
          echo "OK: $bin runs and reports ${{ github.ref_name }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/release/${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: |
          cd artifacts
          sha256sum whip-* > SHA256SUMS
          cat SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Idempotent: a release may already exist for this tag (manually
          # created ahead of the tag push, or a re-run after a partial
          # failure). Reuse it and just (re)upload the assets.
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" \
              artifacts/whip-* \
              artifacts/SHA256SUMS \
              install.sh \
              --clobber
          else
            gh release create "${{ github.ref_name }}" \
              artifacts/whip-* \
              artifacts/SHA256SUMS \
              install.sh \
              --title "${{ github.ref_name }}" \
              --generate-notes
          fi
