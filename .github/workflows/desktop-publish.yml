name: desktop publish
on:
  workflow_call:
    inputs:
      channel:
        required: true
        type: string
      source:
        required: true
        type: string
      mode:
        required: true
        type: string
permissions:
  contents: read

jobs:
  publish:
    if: vars.WHIP_RELEASE_ENABLED == 'true' && vars.WHIP_DESKTOP_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # BOTH stage (public downloads) and promote (live feed) require approval.
    # Deployment rules permit only desktop-v* tags from the clean main boundary.
    environment: desktop-${{ inputs.channel }}-${{ inputs.mode }}
    permissions:
      contents: write
      actions: read
      attestations: read
    env:
      SOURCE_SHA: ${{ inputs.source }}
      RELEASE_TAG: ${{ github.ref_name }}
      WHIP_DESKTOP_PUBLISH_MODE: ${{ inputs.mode }}
      WHIP_DESKTOP_UPDATE_URL: ${{ vars.WHIP_DESKTOP_UPDATE_URL }}
      WHIP_DESKTOP_BUCKET: ${{ vars.WHIP_DESKTOP_BUCKET }}
      WHIP_DESKTOP_R2_ENDPOINT: ${{ vars.WHIP_DESKTOP_R2_ENDPOINT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck clean main after publication approval
        env:
          GH_TOKEN: ${{ github.token }}
          WHIP_RELEASE_BASELINE: ${{ vars.WHIP_RELEASE_BASELINE }}
        run: |
          [[ "$WHIP_RELEASE_BASELINE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$WHIP_RELEASE_BASELINE" "$SOURCE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SOURCE_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: desktop-candidate
          path: candidate
      - name: Require exact source and artifact identity before any publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node apps/desktop/scripts/release-candidate.mjs verify candidate
          for artifact in candidate/*; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow context-labs/whip/.github/workflows/release-desktop.yml \
              --source-digest "$SOURCE_SHA" --source-ref "$GITHUB_REF" \
              --signer-digest "$SOURCE_SHA" --deny-self-hosted-runners
          done
      - name: Stage or promote the complete verified GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release-desktop.yml" --jq .state)" = active
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SOURCE_SHA"
          node apps/desktop/scripts/publish-github.mjs candidate/*
      - name: Stage immutable public downloads without changing the feed
        env:
          GH_TOKEN: ${{ github.token }}
          WHIP_DESKTOP_R2_ACCESS_KEY_ID: ${{ secrets.WHIP_DESKTOP_R2_ACCESS_KEY_ID }}
          WHIP_DESKTOP_R2_SECRET_ACCESS_KEY: ${{ secrets.WHIP_DESKTOP_R2_SECRET_ACCESS_KEY }}
        if: inputs.mode == 'stage'
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release-desktop.yml" --jq .state)" = active
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SOURCE_SHA"
          node apps/desktop/scripts/publish.mjs candidate
      - name: Promote and read back the live feed last
        env:
          GH_TOKEN: ${{ github.token }}
          WHIP_DESKTOP_R2_ACCESS_KEY_ID: ${{ secrets.WHIP_DESKTOP_R2_ACCESS_KEY_ID }}
          WHIP_DESKTOP_R2_SECRET_ACCESS_KEY: ${{ secrets.WHIP_DESKTOP_R2_SECRET_ACCESS_KEY }}
        if: inputs.mode == 'promote'
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release-desktop.yml" --jq .state)" = active
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SOURCE_SHA"
          node apps/desktop/scripts/publish.mjs candidate
