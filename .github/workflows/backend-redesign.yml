name: backend-redesign

on:
  pull_request:
    branches: [codex/backend-redesign, codex/backend-redesign-*]
  push:
    branches: [codex/backend-redesign]

concurrency:
  group: redesign-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  product:
    uses: ./.github/workflows/ci.yml

  # Keep the existing branch-required context while sharing the normal gate.
  redesign:
    if: always()
    needs: product
    runs-on: ubuntu-latest
    steps:
      - name: Require complete product CI
        env:
          PRODUCT_RESULT: ${{ needs.product.result }}
        run: test "$PRODUCT_RESULT" = success
