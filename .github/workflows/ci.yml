name: ci

# One required product gate for production branches, release callers and the
# redesign integration branch. Every supported package is discovered by Taskfile;
# explicit partitions bound heavy suites without narrowing their union.
on:
  workflow_call:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        gate: [build, race-store-first, race-store-rest, race-runtime-first, race-runtime-rest, race-other, clients]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
          # Test compiler cache includes the complete gate definition.
          cache-dependency-path: |
            go.sum
            Taskfile.yaml
      - if: matrix.gate == 'clients'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: go install github.com/go-task/task/v3/cmd/task@v3.48.0
      - if: matrix.gate == 'clients'
        run: npm ci --no-audit --no-fund
      - name: Required ${{ matrix.gate }} gate
        run: |
          # The native browser package exercises dedicated headed sessions.
          # Use the runner's sandbox-capable Chrome and an isolated X display.
          if [[ "$RUNNER_OS" == Linux && ( "${{ matrix.gate }}" == build || "${{ matrix.gate }}" == race-other ) ]]; then
            xvfb-run --auto-servernum task check:${{ matrix.gate }}
          else
            task check:${{ matrix.gate }}
          fi
      - name: Failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-failure-${{ matrix.os }}-${{ matrix.gate }}
          path: test-results/redesign/
          if-no-files-found: ignore
      - name: Diagnostic Go coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.gate }}
          path: test-results/go/*.out
          if-no-files-found: ignore

  products:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, gate: product-web}
          - {os: ubuntu-latest, gate: product-browser}
          # A separate runner avoids sharing the measured workload with other gates.
          - {os: ubuntu-latest, gate: product-performance}
          - {os: ubuntu-latest, gate: product-conversation}
          - {os: ubuntu-latest, gate: product-ui}
          - {os: ubuntu-latest, gate: product-content}
          - {os: ubuntu-latest, gate: product-activity}
          - {os: ubuntu-latest, gate: product-settings}
          - {os: ubuntu-latest, gate: product-distributions}
          - {os: macos-15, gate: product-distributions}
          - {os: ubuntu-latest, gate: product-examples}
          - {os: ubuntu-latest, gate: product-evals}
          - {os: ubuntu-latest, gate: product-docs}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            Taskfile.yaml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: go install github.com/go-task/task/v3/cmd/task@v3.48.0
      - run: npm ci --no-audit --no-fund
      - if: matrix.gate == 'product-evals'
        run: |
          python3 -m venv "$RUNNER_TEMP/whip-eval-uv"
          "$RUNNER_TEMP/whip-eval-uv/bin/pip" install uv==0.11.7
          echo "$RUNNER_TEMP/whip-eval-uv/bin" >> "$GITHUB_PATH"
      - if: matrix.gate == 'product-browser' || matrix.gate == 'product-performance' || matrix.gate == 'product-conversation' || matrix.gate == 'product-ui' || matrix.gate == 'product-docs' || matrix.gate == 'product-content' || matrix.gate == 'product-activity' || matrix.gate == 'product-settings' || matrix.gate == 'product-examples' || matrix.gate == 'product-distributions'
        run: npx playwright install --with-deps chromium firefox
      - if: matrix.gate == 'product-web'
        run: npm audit --omit=dev --audit-level=high
      - name: Required ${{ matrix.gate }} gate
        run: task check:${{ matrix.gate }}
      - name: Verified renderer for desktop and release consumers
        if: matrix.gate == 'product-browser'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-renderer
          if-no-files-found: error
          path: |
            apps/web/dist
            apps/web/renderer-manifest.json
      - name: Product acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: product-evidence-${{ matrix.os }}-${{ matrix.gate }}
          path: |
            test-results/redesign/
            /tmp/whip-*-results/
            /tmp/whip-history-prefetch/
            packages/ui/ui-test-results/
          if-no-files-found: ignore
      - name: Static documentation
        if: matrix.gate == 'product-docs'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docs-static
          if-no-files-found: error
          path: apps/docs/dist/client

  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            Taskfile.yaml
            .golangci.yml
      - run: go install github.com/go-task/task/v3/cmd/task@v3.48.0
      - run: task check:analysis

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      # Per-target: each GOOS/GOARCH has its own standard-library objects, so
      # they get their own cache rather than evicting each other.
      - name: Go build cache (${{ matrix.target }})
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/go-build
          key: gobuild-${{ matrix.target }}-${{ runner.os }}-${{ hashFiles('**/*.go', 'go.sum') }}
          restore-keys: gobuild-${{ matrix.target }}-${{ runner.os }}-

      - name: Cross-compile check (${{ matrix.target }})
        env:
          TARGET: ${{ matrix.target }}
        run: |
          GOOS=${TARGET%/*} GOARCH=${TARGET#*/} CGO_ENABLED=0 \
            go build -trimpath -o /dev/null ./cmd/whip

  # Match the release's Swift driver build and Go embedding boundary.
  driver:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - name: Build the whip-computer Swift driver
        run: |
          swift build -c release --package-path driver
          test -s driver/.build/release/whip-computer

      - name: Full build with the helper embedded
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - run: |
          cp driver/.build/release/whip-computer internal/computer/bin/whip-computer
          go build -trimpath -o /dev/null ./cmd/whip

  desktop:
    needs: products
    uses: ./.github/workflows/desktop-check.yml
    with:
      renderer-artifact: ci-renderer

  mobile:
    uses: ./.github/workflows/mobile.yml

  # Diagnostic coverage is retained; the accepted redesign plan removes the
  # global percentage floor in favor of explicit high-risk scenario guarantees.
  # Safari/physical devices/signing/staged desktop performance remain milestone checks,
  # never silently reported as executed by this hosted workflow.
  go:
    if: always()
    needs: [checks, products, analysis, build, driver, desktop, mobile]
    runs-on: ubuntu-latest
    steps:
      - name: Require every supported gate
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          PRODUCTS_RESULT: ${{ needs.products.result }}
          ANALYSIS_RESULT: ${{ needs.analysis.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DRIVER_RESULT: ${{ needs.driver.result }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
          MOBILE_RESULT: ${{ needs.mobile.result }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$PRODUCTS_RESULT" = success
          test "$ANALYSIS_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$DRIVER_RESULT" = success
          test "$DESKTOP_RESULT" = success
          test "$MOBILE_RESULT" = success
