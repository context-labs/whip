name: desktop downloaded acceptance
on:
  workflow_dispatch:
    inputs:
      archive_url:
        required: true
        type: string
      archive_sha256:
        required: true
        type: string
      version:
        required: true
        type: string
permissions:
  contents: read
jobs:
  minimum-os:
    runs-on: macos-14
    timeout-minutes: 25
    env:
      ARCHIVE_URL: ${{ inputs.archive_url }}
      ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run build
      - name: Download and verify the exact published archive
        run: node apps/desktop/scripts/download-acceptance.mjs
      - name: Launch the notarized app on the minimum supported macOS
        run: node apps/desktop/scripts/startup.mjs 'downloaded/Whip Beta.app' --notarized --samples 3 --first-samples 1 --output acceptance/minimum-os-startup.json
      - name: Require the expected OS, version, and successful cleanup
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          import { execFileSync } from 'node:child_process';
          const os = execFileSync('/usr/bin/sw_vers', ['-productVersion'], { encoding: 'utf8' }).trim();
          assert(os.startsWith('14.'));
          assert.equal(process.arch, 'arm64');
          const evidence = JSON.parse(await readFile('acceptance/minimum-os-startup.json'));
          assert.equal(evidence.evidence.version, process.env.RELEASE_VERSION);
          assert(evidence.completed && !evidence.interrupted);
          assert(evidence.cleanup.every(value => value.state === 'stopped'));
          console.log(`Verified ${process.env.RELEASE_VERSION} on macOS ${os} arm64`);
          NODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: desktop-download-acceptance
          path: acceptance
          if-no-files-found: error
          retention-days: 30
