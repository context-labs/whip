name: ci

# PR health gate: format, vet, lint, tests, build, dependency hygiene.
# Mirrors `task check` (the pre-commit hook) plus the release workflow's
# Swift driver build, so a PR can't break the next tag's release.
#
# The work is split across jobs that run on separate runners, so wall-clock is
# the slowest job rather than the sum of every step. `go` is a required status
# check (repo ruleset), so it stays — as the gate that fails unless all three
# parallel jobs succeeded. Add a new job to `go`'s `needs` when you add one,
# or its failures won't block a merge.
on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref/PR — a force-push or a quick follow-up
# commit shouldn't waste a runner on a stale diff.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # setup-go's own cache keys on go.sum alone, so once it exists it never
      # refreshes — every run recompiles from whatever was cached the first
      # time. Key on the sources too, with a prefix restore-key, so each run
      # starts from the nearest previous compile and saves an updated cache.
      - name: Go build cache (lint)
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: gobuild-lint-${{ runner.os }}-${{ hashFiles('**/*.go', 'go.sum') }}
          restore-keys: gobuild-lint-${{ runner.os }}-

      - name: gofmt -s (matches task check)
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "needs gofmt -s:"; echo "$unformatted"; exit 1
          fi

      # Kept alongside golangci-lint's govet: the two run overlapping but not
      # identical analyzer sets, and here it costs no extra wall-clock.
      - name: go vet
        run: go vet ./...

      # Custom analyzer: catches a synchronous tea.Program.Send reachable from
      # the TUI event loop (the frozen-ctrl+p deadlock). No off-the-shelf
      # linter covers it; it lives in ./cmd/whipvet.
      - name: whipvet (TUI deadlock analyzer)
        run: go run ./cmd/whipvet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned: "latest" is a moving target and older releases can't parse
          # Go 1.27 export data. Bump deliberately alongside the Go toolchain.
          # The enabled linters live in .golangci.yml (repo source of truth).
          version: v2.13.1

      - name: go mod tidy is a no-op
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || { echo "run \`go mod tidy\` and commit"; exit 1; }

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # internal/browser e2e tests need a Chromium sandbox and internal/tui
      # tests need a tty — neither exists on hosted runners. Same portable
      # set the release gate runs; the full suite stays local (task test).
      # -race catches data races; -shuffle=on randomizes test order to catch
      # inter-test dependencies a contributor might introduce. Coverage is
      # recorded so the gate below can fail the PR if it drops.
      # See the note in the lint job: the -race + -coverpkg objects are the
      # expensive part of this job and setup-go's go.sum-keyed cache never
      # refreshes to hold them.
      - name: Go build cache (race + coverage objects)
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: gobuild-test-${{ runner.os }}-${{ hashFiles('**/*.go', 'go.sum') }}
          restore-keys: gobuild-test-${{ runner.os }}-

      - name: go test (portable set, with coverage)
        run: |
          PKGS=$(go list ./... | grep -v -e /internal/browser -e /internal/tui)
          go test -race -shuffle=on \
            -coverprofile=cover.out -coverpkg="$(echo $PKGS | tr ' ' ',')" $PKGS

      # Self-contained coverage floor — no external service or token, so it
      # works identically on fork PRs. Baseline today is ~93.6%; the gate fails
      # if total statement coverage drops below the floor. Ratchet the floor up
      # over time as coverage improves (don't lower it).
      - name: coverage floor (90%)
        run: |
          total=$(go tool cover -func=cover.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          echo "total coverage: ${total}%"
          awk -v t="$total" -v floor=90 'BEGIN { if (t+0 < floor) { printf "coverage %.1f%% is below the %d%% floor\n", t, floor; exit 1 } }'

  # Each GOOS/GOARCH compiles its own copy of the standard library and shares
  # no build cache with the others, and `go build` already saturates a
  # runner's cores on one target — so the four get a runner each rather than
  # taking turns. `needs: [build]` waits for every leg.
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Per-target: each GOOS/GOARCH has its own standard-library objects, so
      # they get their own cache rather than evicting each other.
      - name: Go build cache (${{ matrix.target }})
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: gobuild-${{ matrix.target }}-${{ runner.os }}-${{ hashFiles('**/*.go', 'go.sum') }}
          restore-keys: gobuild-${{ matrix.target }}-${{ runner.os }}-

      - name: Cross-compile check (${{ matrix.target }})
        env:
          TARGET: ${{ matrix.target }}
        run: |
          GOOS=${TARGET%/*} GOARCH=${TARGET#*/} CGO_ENABLED=0 \
            go build -trimpath -o /dev/null ./cmd/whip

  # `go` is a required status check in the repo's ruleset, so the name has to
  # survive the split. It is now the aggregate gate: green only when lint,
  # test and build all passed. if: always() so a failed dependency reports as
  # a failure here rather than a skip.
  go:
    needs: [lint, test, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: require every gate to have passed
        run: |
          echo "lint=${{ needs.lint.result }}"
          echo "test=${{ needs.test.result }}"
          echo "build=${{ needs.build.result }}"
          [ "${{ needs.lint.result }}" = success ] || exit 1
          [ "${{ needs.test.result }}" = success ] || exit 1
          [ "${{ needs.build.result }}" = success ] || exit 1

  # The release pipeline builds the computer-use Swift driver on macOS and
  # go:embeds it — build it here too so a driver-breaking change fails the
  # PR, not the next release.
  driver:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - name: Build the whip-computer Swift driver
        run: |
          swift build -c release --package-path driver
          test -s driver/.build/release/whip-computer

      - name: Full build with the helper embedded
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: |
          cp driver/.build/release/whip-computer internal/computer/bin/whip-computer
          go build -trimpath -o /dev/null ./cmd/whip
