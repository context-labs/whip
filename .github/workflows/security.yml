name: security

# Security gate for PRs and main: dependency vulnerabilities, SAST, and CodeQL.
#
# Safe for untrusted (outside-contributor) PRs:
#   * Every job runs with the default pull_request trigger — untrusted code
#     executes, but the GITHUB_TOKEN is read-only and no secrets are exposed.
#   * The ONLY job that writes (uploads SARIF to the Security tab) is CodeQL,
#     which uses GitHub's own action with a narrowly-scoped security-events
#     permission and never checks out the PR's build scripts for execution.
#   * There is no pull_request_target trigger anywhere, so a fork can never
#     run with a writable token or secrets.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly re-scan of main: new CVEs drop against unchanged deps.
    - cron: "17 6 * * 1"

# Cancel superseded runs on the same ref/PR — a force-push or a quick follow-up
# commit shouldn't waste a runner on a stale diff.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Known-vulnerability scan. govulncheck only reports CVEs in code paths the
  # project actually reaches, so it's low-noise. Fails the PR if a reachable
  # vuln is found. Runs against the module's real dependency graph.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # govulncheck needs a toolchain >= the module's go directive; setup-go
      # already selected it. GOTOOLCHAIN=local pins to that exact toolchain.
      - name: govulncheck
        env:
          GOTOOLCHAIN: local
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # NOTE on gosec: it already runs as a linter inside golangci-lint (see the
  # `go` job in ci.yml), where the repo's deliberate `//nolint:gosec // reason`
  # suppressions are honored. A standalone gosec binary here would re-flag
  # those same triaged findings (it reads #nosec, not //nolint) and duplicate
  # the signal, so we don't run it twice. CodeQL below is the independent SAST
  # pass and surfaces in the Security tab.

  # CodeQL semantic analysis. Results land in the repo's Security tab. The
  # security-events:write permission is scoped to THIS job only and the
  # analysis does not execute the PR's code (it builds it in a sandbox), so
  # it's safe on untrusted PRs. Uses the security-and-quality suite for a few
  # maintainability/reliability queries on top of the default security set.
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: go
          queries: security-and-quality
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:go"
