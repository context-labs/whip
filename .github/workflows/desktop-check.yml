name: desktop check
on:
  workflow_call:
    inputs:
      renderer-artifact:
        required: true
        type: string
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Initialize protocol artifacts and SDK
        run: |
          npm run generate
          npm run build
      - run: node node_modules/electron/install.js
      - run: npx playwright install ffmpeg
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ inputs.renderer-artifact }}
          path: apps/web
      - name: Verify shared renderer provenance and package input
        run: node scripts/pack-web.mjs --release
      - run: npm run check:desktop
      - name: Native helper races and parent-lifetime acceptance
        run: |
          go test -race -shuffle=on -count=1 ./cmd/whip ./internal/daemon -run '^Test(Desktop|Maintenance)'
          go test -race -tags=integration ./cmd/whip -run '^TestDesktopCompiledUpdate$' -v
      - name: Package and verify the arm64 desktop without rebuilding the renderer
        run: |
          mkdir -p .ai-docs/plans/desktop-app/evidence
          npm run package:desktop -- --renderer-ready
          node apps/desktop/scripts/verify.mjs 'apps/desktop/out/Whip-darwin-arm64/Whip.app'
      - name: Native tests including isolated real SSH authentication and forwarding
        run: WHIP_DESKTOP_SSH_TEST_EXECUTABLE="$PWD/apps/desktop/.stage/native/whipcode" npm run test:desktop
      - name: Staged desktop lifecycle smoke
        env:
          WHIP_DESKTOP_SMOKE_ARTIFACTS: .ai-docs/plans/desktop-app/evidence/ci-lifecycle-smoke
          WHIP_DESKTOP_SMOKE_OUTPUT: .ai-docs/plans/desktop-app/evidence/ci-lifecycle-smoke/result.json
        run: node apps/desktop/scripts/smoke.mjs
      - name: Desktop package and lifecycle evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-ci-evidence
          if-no-files-found: warn
          path: .ai-docs/plans/desktop-app/evidence
