name: desktop check
on:
  workflow_call:
    inputs:
      renderer-artifact:
        required: true
        type: string
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: node node_modules/electron/install.js
      - run: npx playwright install ffmpeg
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ inputs.renderer-artifact }}
          path: apps/web
      - run: go install github.com/go-task/task/v3/cmd/task@v3.48.0
      - name: Complete staged desktop acceptance using the tested renderer
        run: task check:product-desktop RENDERER_READY=true
      - name: Desktop package and lifecycle evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-ci-evidence
          if-no-files-found: warn
          path: test-results/redesign/desktop/
