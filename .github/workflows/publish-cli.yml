name: releaseWHIP

on:
  push:
    branches: [development]
  workflow_dispatch:
    inputs:
      channel:
        description: Alpha prerelease or explicitly approved stable release
        type: choice
        options: [alpha, stable]
        default: alpha
        required: true

# ponytail: serialize each release train; newer pending alphas may coalesce,
# but never interrupt an active release or wait behind stable approval.
concurrency:
  group: whipcode-publishing-${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'alpha' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  metadata:
    if: >-
      github.repository == 'context-labs/whip' &&
      vars.WHIP_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      mode: ${{ steps.version.outputs.mode }}
      source: ${{ steps.version.outputs.source }}
      source_ref: ${{ steps.version.outputs.source_ref }}
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Admit one clean branch source and shared release identity
        id: version
        env:
          SOURCE_SHA: ${{ github.sha }}
          WHIP_RELEASE_BASELINE: ${{ vars.WHIP_RELEASE_BASELINE }}
          WHIP_RELEASE_ENABLED: ${{ vars.WHIP_RELEASE_ENABLED }}
          RELEASE_MODE: ${{ github.event_name == 'push' && 'alpha' || inputs.channel }}
          RUN_NUMBER: ${{ github.run_number }}
          BASE_VERSION: 1.0.1
        run: |
          [[ "$GITHUB_REPOSITORY" == context-labs/whip && "$WHIP_RELEASE_ENABLED" == true ]]
          case "$GITHUB_EVENT_NAME:$GITHUB_REF:$RELEASE_MODE" in
            push:refs/heads/development:alpha|workflow_dispatch:refs/heads/development:alpha)
              source_ref=refs/heads/development; version="$BASE_VERSION-alpha.$RUN_NUMBER"; channel=beta ;;
            workflow_dispatch:refs/heads/main:stable)
              source_ref=refs/heads/main; version="$BASE_VERSION"; channel=stable ;;
            *) echo "Unsupported release event/ref/mode" >&2; exit 1 ;;
          esac
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$SOURCE_SHA" == "$GITHUB_SHA" ]]
          [[ "$WHIP_RELEASE_BASELINE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASE_VERSION" =~ ^[1-9][0-9]*\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$RUN_NUMBER" =~ ^[1-9][0-9]*$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          source_branch=${source_ref#refs/heads/}
          git fetch --no-tags origin "$source_ref:refs/remotes/origin/$source_branch"
          git merge-base --is-ancestor "$WHIP_RELEASE_BASELINE" "$SOURCE_SHA"
          git merge-base --is-ancestor "$SOURCE_SHA" "refs/remotes/origin/$source_branch"
          printf 'tag=v%s\nversion=%s\nmode=%s\nchannel=%s\nsource=%s\nsource_ref=%s\n' "$version" "$version" "$RELEASE_MODE" "$channel" "$SOURCE_SHA" "$source_ref" >> "$GITHUB_OUTPUT"

  ci:
    needs: metadata
    uses: ./.github/workflows/ci.yml

  security:
    needs: metadata
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/security.yml

  build:
    needs: [metadata, ci, security]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            asset: whipcode-linux-x64
            driver: false
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            asset: whipcode-linux-arm64
            driver: false
          - os: macos-15
            goos: darwin
            goarch: arm64
            asset: whipcode-darwin-arm64
            driver: true
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
            asset: whipcode-darwin-x64
            driver: true
    runs-on: ${{ matrix.os }}
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: '0'
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      ASSET: ${{ matrix.asset }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.metadata.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ci-renderer
          path: apps/web
      - name: Verify and package the tested browser application
        run: |
          node scripts/pack-web.mjs --release
          test -s internal/webassets/dist/index.html
      - name: Build the embedded Swift driver
        if: matrix.driver
        run: |
          swift build -c release --package-path driver
          cp driver/.build/release/whip-computer internal/computer/bin/whip-computer
          codesign --sign - --force internal/computer/bin/whip-computer
          test -s internal/computer/bin/whip-computer
      - name: Build distribution
        run: |
          mkdir -p dist/release
          go build -trimpath \
            -ldflags "-s -w -X main.version=$RELEASE_TAG" \
            -o "dist/release/$ASSET" ./cmd/whip
      - name: Accept the packaged binary from a fresh home with the tested renderer
        run: python3 scripts/test-distributions.py --binary "dist/release/$ASSET" --version "$RELEASE_TAG"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: whipcode-bin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/release/${{ matrix.asset }}
          if-no-files-found: error

  desktop:
    needs: [metadata, ci, security]
    uses: ./.github/workflows/desktop-release.yml
    # Preserve the working reusable signing-secret transport. The called job
    # still binds desktop-signing and exposes credentials only to its import step.
    secrets: inherit
    with:
      renderer-artifact: ci-renderer
      version: ${{ needs.metadata.outputs.version }}
      channel: ${{ needs.metadata.outputs.channel }}
      source: ${{ needs.metadata.outputs.source }}

  linux:
    needs: [metadata, build]
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.metadata.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ci-renderer
          path: apps/web
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: whipcode-bin-linux-amd64
          path: linux
      - name: Accept the exact standalone Linux bytes, never rebuild
        run: |
          chmod +x linux/whipcode-linux-x64
          node apps/desktop/scripts/linux-smoke.mjs linux/whipcode-linux-x64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-linux-evidence
          path: linux/linux-runtime.json
          if-no-files-found: error

  candidate:
    needs: [metadata, build, desktop, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      SOURCE_SHA: ${{ needs.metadata.outputs.source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.metadata.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: whipcode-bin-*
          path: candidate
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: desktop-release-arm64
          path: candidate
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-linux-evidence
          path: candidate
      - name: Install candidate verifier dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Assemble and verify the exact complete release inventory
        run: |
          node scripts/build-installers.mjs "$RELEASE_TAG" candidate
          node apps/desktop/scripts/release-candidate.mjs assemble candidate
      - name: Attest every final asset and the aggregate manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: candidate/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-candidate
          path: candidate
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish:
    needs: [metadata, candidate]
    if: vars.WHIP_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Reuse existing R2 environment secrets: alpha automatic, stable one approval.
    environment: ${{ needs.metadata.outputs.mode == 'stable' && 'desktop-stable-stage' || 'desktop-beta-stage' }}
    permissions:
      contents: write
      actions: read
      attestations: read
    env:
      GH_REPO: context-labs/whip
      SOURCE_SHA: ${{ needs.metadata.outputs.source }}
      SOURCE_REF: ${{ needs.metadata.outputs.source_ref }}
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      RELEASE_MODE: ${{ needs.metadata.outputs.mode }}
      WHIP_RELEASE_ENABLED: ${{ vars.WHIP_RELEASE_ENABLED }}
      WHIP_RELEASE_BASELINE: ${{ vars.WHIP_RELEASE_BASELINE }}
      WHIP_DESKTOP_UPDATE_URL: ${{ vars.WHIP_DESKTOP_UPDATE_URL }}
      WHIP_DESKTOP_BUCKET: ${{ vars.WHIP_DESKTOP_BUCKET }}
      WHIP_DESKTOP_R2_ENDPOINT: ${{ vars.WHIP_DESKTOP_R2_ENDPOINT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.metadata.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-candidate
          path: candidate
      - name: Verify complete candidate provenance from the admitted source ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$RELEASE_MODE:$SOURCE_REF" in
            alpha:refs/heads/development|stable:refs/heads/main) ;;
            *) exit 1 ;;
          esac
          [[ "$SOURCE_REF" == "$GITHUB_REF" && "$SOURCE_SHA" == "$GITHUB_SHA" ]]
          node apps/desktop/scripts/release-candidate.mjs verify candidate
          for asset in candidate/*; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow context-labs/whip/.github/workflows/publish-cli.yml \
              --signer-digest "$SOURCE_SHA" --source-ref "$SOURCE_REF" --source-digest "$SOURCE_SHA" --deny-self-hosted-runners
          done
      - name: Publish one immutable release, then the matching update feed
        env:
          GH_TOKEN: ${{ github.token }}
          WHIP_DESKTOP_R2_ACCESS_KEY_ID: ${{ secrets.WHIP_DESKTOP_R2_ACCESS_KEY_ID }}
          WHIP_DESKTOP_R2_SECRET_ACCESS_KEY: ${{ secrets.WHIP_DESKTOP_R2_SECRET_ACCESS_KEY }}
        run: bash scripts/publish-whipcode.sh candidate
